 let h=s.ps.map(p=>`<div class="pr t${p.t}"><span>${esc(p.n)}${p.id==MYID?' (Du)':''}${p.id==LS.host?' 👑':''}</span><small>${TN[p.t]} · ${p.d||'⌨️'} · ● verbunden</small><b>${p.r?'✔ BEREIT':'…'}</b></div>`).join('');
 for(let i=s.ps.length;i<s.cap;i++)h+='<div class="pr e"><span>wartet auf Spieler…</span></div>';$('#pl').innerHTML=h;
 $('#hc').style.display=s.iH?'flex':'none';$('#go').style.display=s.iH?'':'none';$('#go').disabled=!s.ok;
 $$('[data-a=m1],[data-a=m2]').forEach(b=>b.disabled=s.ps.length>(b.dataset.a=='m1'?2:4));
 $('#lh').textContent=s.ok?'Alles bereit – Match kann starten!':s.ps.length<s.cap&&!LS.bots?`Warte auf Spieler (${s.ps.length}/${s.cap})`:!s.ps.every(x=>x.r)?'Warte, bis alle Spieler bereit sind':s.c[0]>s.cap/2||s.c[1]>s.cap/2?'Teams sind unausgeglichen':s.iH?'':'Der Host startet das Match'}
async function enter(code,mode,kind){try{await conn()}catch(e){toast('Server nicht erreichbar – Solo-Training geht immer.');return false}
 pj=1;setTimeout(()=>{if(pj){pj=0;toast('Beitritt fehlgeschlagen')}},5000);mp={n:NAME,t:0,r:0,d:dev()};send('join',{code,mode,kind,n:NAME,d:dev()});return true}
function leaveRoom(){send('leave')}
function startClick(){if(lstate().ok)send('start')}
function backLobby(ready){clearMatch();if(!WS){show('main');return}send('back',{r:ready?1:0});show('lobby');renderLobby()}
async function toMenu(){clearMatch();leaveRoom();SOLO=false;show('main')}
function quick(m){toast('Suche Lobby…');enter('',m,'q')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;SF.click();ambient();const a=b.dataset.a;
 if(a=='q1'||a=='q2'||a=='mk'||a=='jn'||a=='solo'||a=='solo2'){NAME=($('#nm').value.trim()||'Spieler'+Math.floor(Math.random()*90+10)).slice(0,12);try{localStorage.setItem('ka_n',NAME)}catch(x){}}
 if(a=='q1')quick(1);else if(a=='q2')quick(2);
 else if(a=='mk'){const c=[...Array(6)].map(()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');enter(c,1,'mk')}
 else if(a=='jn'){const c=$('#cd').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4)toast('Bitte gültigen Raum-Code eingeben');else{toast('Verbinde…');enter(c,1,'jn')}}
 else if(a=='solo'){SOLO=true;startMatch({id:rid(),h:'solo',tl:300,solo:1,roster:[{peer:'solo',name:NAME,team:0},{peer:'bot0',name:'Bot',team:1,bot:1}]})}
 else if(a=='solo2'){SOLO=true;startMatch({id:rid(),h:'solo',tl:300,solo:1,roster:[{peer:'solo',name:NAME,team:0},{peer:'bot0',name:'Bot 1',team:0,bot:1},{peer:'bot1',name:'Bot 2',team:1,bot:1},{peer:'bot2',name:'Bot 3',team:1,bot:1}]})}
 else if(a=='opt'){ctlTxt();show('opt')}else if(a=='quit'){window.close();toast('Bitte den Tab schließen, um zu beenden.')}
 else if(a=='menu')toMenu();else if(a=='resume')ov();else if(a=='lob')backLobby(0);else if(a=='rem')backLobby(1);
 else if(a=='m1'||a=='m2'){setP({m:a=='m1'?1:2});renderLobby()}
 else if(a=='team'){const s=lstate(),nt=1-mp.t,n=s.pl.filter(x=>x.presence.t==nt).length;if(nt>=0&&n<s.cap/2)setP({t:nt});else toast('Das andere Team ist voll');renderLobby()}
 else if(a=='rdy'){setP({r:mp.r?0:1});renderLobby()}else if(a=='go')startClick()});
$('#bots').onchange=()=>send('set',{bots:$('#bots').checked?1:0});$('#vol').oninput=e=>VOL=+e.target.value;$('#shd').onchange=e=>{ren.shadowMap.enabled=e.target.checked;sun.castShadow=e.target.checked;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true})};
conn().catch(()=>{});
/* ---------- Main loop ---------- */
let last=performance.now(),acc=0,snT=0,inT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;navPad();
 if(M&&P.length){if(!M.dead){readIn(dt);
  if(HOST){if(ME>=0)P[ME].i=IN;acc+=dt;let n=0;while(acc>=1/60&&n++<4){sim(1/60);acc-=1/60}if(n>=4)acc=0;snT+=dt;if(snT>=.05){snT=0;const s=snap();fx(s);if(R&&!SOLO)send('st',s)}}
  else{if(ME>=0&&CUR&&CUR.ph=='play')stepP(P[ME],dt,IN);smooth(dt);inT+=dt;if(inT>=.033&&ME>=0&&!(CUR&&CUR.ph=='end')){inT=0;send('inp',IN)}if(now-M.rx>5000)lost('Der Host')}}
  vis(dt)}
 crowdUp(dt);ambSet();confUp(dt);ren.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
